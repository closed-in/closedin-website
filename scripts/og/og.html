<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og</title>
<!-- Link-preview image template (20-10-2026): rendered at 1200x630 by scripts/og-images.mjs, data in the URL hash. -->
<style>
@font-face { font-family: "Inter"; src: url("../../case-study-showcase/assets/fonts/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: #020304; }
body { position: relative; font-family: "Inter", sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
canvas { position: absolute; inset: 0; }
.glow { position: absolute; inset: 0; background: radial-gradient(55% 75% at 92% 8%, rgba(114, 193, 255, .20), rgba(114, 193, 255, 0) 62%), radial-gradient(40% 60% at 0% 100%, rgba(114, 193, 255, .08), rgba(114, 193, 255, 0) 70%); }
.frame { position: absolute; inset: 64px 72px 60px; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; justify-content: space-between; }
.wm { height: 34px; width: auto; display: block; }
.url { font: 400 15px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .08em; color: rgba(255, 255, 255, .55); }
.mid { margin-top: auto; }
.pill { display: inline-flex; align-items: center; gap: 10px; height: 38px; padding: 0 16px; border: 1px solid rgba(255, 255, 255, .16); border-radius: 999px; background: rgba(255, 255, 255, .04); font: 400 14px/1 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .1em; text-transform: uppercase; color: rgba(255, 255, 255, .78); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: #72C1FF; box-shadow: 0 0 12px #72C1FF; }
h1 { margin-top: 26px; max-width: 920px; font-weight: 500; font-size: 66px; line-height: 1.06; letter-spacing: -0.034em; text-wrap: balance; }
h1 b { font-weight: 500; color: #fff; }
h1 .g { color: #8d939c; }
.bottom { margin-top: 40px; display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; min-height: 64px; }
.stats { display: flex; gap: 0; }
.stat { padding: 0 34px; border-left: 1px solid rgba(255, 255, 255, .14); }
.stat:first-child { padding-left: 0; border-left: 0; }
.stat b { display: block; font-size: 46px; font-weight: 500; line-height: 1; letter-spacing: -0.035em; color: #fff; }
.stat span { display: block; margin-top: 10px; font: 400 13px/1.2 ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .1em; text-transform: uppercase; color: rgba(255, 255, 255, .55); }
.tag { font-size: 20px; line-height: 1.4; color: #a3a8b1; max-width: 640px; }
.cta { flex: none; display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 22px; border-radius: 14px; background: #72C1FF; color: #0C0D0E; font-size: 19px; font-weight: 500; }
.cta svg { width: 18px; height: 18px; }
</style>
</head>
<body>
<canvas id="g" width="1200" height="630"></canvas>
<div class="glow"></div>
<div class="frame">
  <div class="top"><img class="wm" src="../../case-study-showcase/assets/brand/closedin-wordmark-white.png" alt=""><span class="url">closedin.io</span></div>
  <div class="mid">
    <span class="pill"><i></i><span id="eyebrow"></span></span>
    <h1 id="title"></h1>
  </div>
  <div class="bottom"><div id="left"></div><span class="cta" id="cta"></span></div>
</div>
<script>
const D = JSON.parse(decodeURIComponent(location.hash.slice(1) || '{}'));
document.getElementById('eyebrow').textContent = D.eyebrow || 'GTM engineering agency';
const h = document.getElementById('title'); h.innerHTML = D.title || '';
const left = document.getElementById('left');
if (D.stats && D.stats.length) {
  left.className = 'stats';
  left.innerHTML = D.stats.slice(0, 3).map(s => `<div class="stat"><b>${s[0]}</b><span>${s[1]}</span></div>`).join('');
} else { left.className = 'tag'; left.textContent = D.tag || 'GTM engineering agency, Amsterdam. Outbound that books qualified B2B sales calls.'; }
const cta = document.getElementById('cta');
cta.innerHTML = (D.cta || 'Read more') + '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4"/></svg>';
/* glyph field: a band of monospace glyphs in the accent colour along the top right, like the site's sections */
const c = document.getElementById('g'), x = c.getContext('2d');
const G = '01:/<>{}[]+=*#%&?$@'.split('');
let seed = (D.seed || 7) * 9301;
const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
const shapes = [{ x: .86, y: .16, rx: .2, ry: .24 }, { x: .99, y: .62, rx: .06, ry: .3 }, { x: .02, y: .96, rx: .2, ry: .1 }];
x.font = '500 13px ui-monospace, "SF Mono", Menlo, monospace';
for (let gy = 8; gy < 630; gy += 18) for (let gx = 6; gx < 1200; gx += 14) {
  let v = 0;
  for (const s of shapes) { const dx = (gx / 1200 - s.x) / s.rx, dy = (gy / 630 - s.y) / s.ry; v += Math.exp(-(dx * dx + dy * dy)); }
  v = Math.min(1, v) * (0.55 + 0.45 * rnd());
  if (v < 0.12) continue;
  x.fillStyle = `rgba(114, 193, 255, ${(v * 0.42).toFixed(3)})`;
  x.fillText(G[Math.floor(rnd() * G.length)], gx, gy);
}
/* fit the title: three lines at most */
document.fonts.ready.then(() => {
  let fs = 66; while (h.getBoundingClientRect().height > fs * 1.06 * 3 + 4 && fs > 40) { fs -= 2; h.style.fontSize = fs + 'px'; }
  document.title = 'ready';
});
</script>
</body>
</html>
